services:
  # ── Base de datos MySQL ──────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ticketcasino_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tc_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticketcasino_db}
      MYSQL_USER: ${MYSQL_USER:-casino_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-casino_pass_2026}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-tc_root_2026}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ticketcasino_net

  # ── Backend NestJS ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketcasino_backend
    restart: always
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-casino_user}:${MYSQL_PASSWORD:-casino_pass_2026}@db:3306/${MYSQL_DATABASE:-ticketcasino_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_ticketcasino_2026_changeme}
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticketcasino_net

  # ── Frontend React + Nginx ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketcasino_frontend
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - ticketcasino_net

volumes:
  db_data:

networks:
  ticketcasino_net:
    driver: bridge
